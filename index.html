<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Молочка — КР РОАГ</title>
<meta name="description" content="Практическое приложение по болезням молочной железы по КР РОАГ 2024 (ID 858_1, ID 598) + BI-RADS тренажёр">
<meta name="theme-color" content="#0f3d5e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --ink:#0a0a0a; --ink2:#1f2a33; --line:#9aa7b2;
  --brand:#0f3d5e; --brand-ink:#ffffff; --accent:#c2185b;
  --red:#b00020; --red-bg:#fde7ea; --amb:#7a4a00; --amb-bg:#fff1d6;
  --ok:#0b5d1e; --ok-bg:#e3f5e7; --info:#0b3d91; --info-bg:#e6efff;
  --chip:#e9eef2; --chip-on:#0f3d5e; --chip-on-ink:#fff;
  --q-bg:#f3f0e6; --q-ink:#1a1a1a;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0c1116; --card:#151c23; --ink:#ffffff; --ink2:#e6edf3; --line:#5b6b78;
    --brand:#7fc4ff; --brand-ink:#04121e; --accent:#ff7fb0;
    --red:#ff9aa5; --red-bg:#3a0d14; --amb:#ffd27a; --amb-bg:#3a2a07; --ok:#8ff0a4; --ok-bg:#0d3318;
    --info:#a9c8ff; --info-bg:#0e2547; --chip:#24303b; --chip-on:#7fc4ff; --chip-on-ink:#04121e;
    --q-bg:#22201a; --q-ink:#f5f1e6;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
header{background:#0f3d5e;color:#fff;padding:12px 16px 0;position:sticky;top:0;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.25)}
header h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.2px}
header .sub{font-size:12.5px;color:#e8f3ff;margin-top:2px}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:0;background:transparent;color:#d9ecff;font:700 14.5px system-ui;padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:#fff;border-bottom-color:#ffb3d1}
main{max-width:900px;margin:0 auto;padding:14px 16px 90px}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 14px}
h2{font-size:18px;margin:0 0 10px;color:var(--ink)}
h3{font-size:16px;margin:14px 0 8px;color:var(--ink)}
.lbl{font-weight:700;font-size:14px;margin:12px 0 6px;color:var(--ink2)}
.lbl:first-child{margin-top:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--chip);color:var(--ink);font:600 14px system-ui;padding:8px 11px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--chip);border-radius:10px;padding:7px 10px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.chk input{width:18px;height:18px;accent-color:#c2185b}
input[type=number],select{font:600 16px system-ui;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:110px}
select{width:auto;max-width:100%}
input[type=range]{width:100%;accent-color:#c2185b}
.sec{border-radius:12px;padding:12px 14px;margin:0 0 12px;border:1.5px solid}
.sec h4{margin:0 0 8px;font-size:15.5px}
.sec.red{background:var(--red-bg);border-color:var(--red)} .sec.red h4{color:var(--red)}
.sec.amb{background:var(--amb-bg);border-color:var(--amb)} .sec.amb h4{color:var(--amb)}
.sec.ok{background:var(--ok-bg);border-color:var(--ok)} .sec.ok h4{color:var(--ok)}
.sec.info{background:var(--info-bg);border-color:var(--info)} .sec.info h4{color:var(--info)}
.sec.plain{background:var(--card);border-color:var(--line)}
.rec{margin:0 0 8px;padding:0 0 8px;border-bottom:1px dashed var(--line);color:var(--ink)}
.rec:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.rec .rt{font-size:15px}
.rec.off .rt{text-decoration:line-through;opacity:.85}
.gr{display:inline-block;font:800 11.5px system-ui;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:1px;border:1.5px solid}
.gA{background:#0b5d1e;color:#fff;border-color:#0b5d1e}
.gB{background:#0b3d91;color:#fff;border-color:#0b3d91}
.gC{background:#fff;color:#111;border-color:#111}
.gX{background:#5a5a5a;color:#fff;border-color:#5a5a5a}
details{margin-top:4px}
summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--info);list-style:none}
summary::before{content:"▸ "} details[open] summary::before{content:"▾ "}
blockquote{margin:6px 0 0;padding:8px 10px;background:var(--q-bg);color:var(--q-ink);border-left:4px solid var(--accent);border-radius:6px;font-size:14px}
blockquote cite{display:block;margin-top:4px;font-style:normal;font-weight:700;font-size:12px}
.note{font-size:13.5px;color:var(--ink2)}
.warn{font-weight:700;color:var(--red)}
.dose{font-weight:700}
table{border-collapse:collapse;width:100%;font-size:14px;color:var(--ink)}
th,td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{background:var(--chip)}
.tblwrap{overflow-x:auto}
.btn{border:0;background:#0f3d5e;color:#fff;font:700 15px system-ui;padding:11px 16px;border-radius:10px;cursor:pointer}
.btn.alt{background:var(--chip);color:var(--ink);border:1.5px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12.5px;font-weight:800}
.p-ag{background:#0b5d1e;color:#fff}.p-onc{background:#b00020;color:#fff}.p-mid{background:#7a4a00;color:#fff}
.bir{display:grid;grid-template-columns:62px 1fr;gap:0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:8px}
.bir .n{display:flex;align-items:center;justify-content:center;font:900 24px system-ui;color:#fff}
.bir .t{padding:9px 11px;background:var(--card)}
.c0{background:#4b5563}.c1{background:#0b5d1e}.c2{background:#2e7d32}.c3{background:#a15c00}.c4{background:#c62828}.c5{background:#7f0000}.c6{background:#311b92}
/* trainer */
.case-img{background:#000;border-radius:10px;overflow:hidden;line-height:0;border:1.5px solid #000}
.case-img svg{width:100%;height:auto;display:block}
.opts{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.opts button{font:900 20px system-ui;padding:12px 0;border-radius:10px;border:2px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.topts{display:grid;gap:6px}
.topts button{text-align:left;font:600 14.5px system-ui;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.opts button.right,.topts button.right{background:#0b5d1e;color:#fff;border-color:#0b5d1e}
.opts button.wrong,.topts button.wrong{background:#b00020;color:#fff;border-color:#b00020}
.opts button:disabled,.topts button:disabled{cursor:default}
.score{font-weight:800}
.copybar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1.5px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:none;justify-content:center;gap:10px;z-index:9}
.copybar.on{display:flex}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:9px 14px;border-radius:9px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
footer{font-size:12.5px;color:var(--ink2);padding:6px 0 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>Молочка · болезни молочной железы</h1>
  <div class="sub">КР РОАГ 2024: «Воспалительные заболевания МЖ» (ID 858_1) · «ДДМЖ» (ID 598)</div>
  <nav id="nav">
    <button data-t="mast" class="on">Мастит</button>
    <button data-t="ddmzh">ДДМЖ: маршрут</button>
    <button data-t="pain">Масталгия</button>
    <button data-t="birads">BI-RADS</button>
    <button data-t="train">Тренажёр BI-RADS</button>
  </nav>
</header>

<main>
<!-- ================= МАСТИТ ================= -->
<section class="tab on" id="t-mast">
  <div class="card" id="mast-form"></div>
  <div id="mast-out"></div>
</section>

<!-- ================= ДДМЖ ================= -->
<section class="tab" id="t-ddmzh">
  <div class="card" id="dd-form"></div>
  <div id="dd-out"></div>
</section>

<!-- ================= МАСТАЛГИЯ ================= -->
<section class="tab" id="t-pain">
  <div class="card" id="pain-form"></div>
  <div id="pain-out"></div>
</section>

<!-- ================= BI-RADS справочник ================= -->
<section class="tab" id="t-birads"><div id="bir-ref"></div></section>

<!-- ================= ТРЕНАЖЁР ================= -->
<section class="tab" id="t-train"><div id="trainer"></div></section>

<footer>Инструмент поддержки решений по тексту КР. Не заменяет клиническое мышление и инструкции к препаратам. «#» — применение вне инструкции (off-label), как в КР.</footer>
</main>

<div class="copybar" id="copybar">
  <button class="btn" id="copyBtn">Скопировать тактику</button>
  <button class="btn alt" id="resetBtn">Сброс</button>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============ общие хелперы ============ */
const SRC_M = "КР «Воспалительные заболевания молочных желез» 2024, ID 858_1";
const SRC_D = "КР «Доброкачественная дисплазия молочной железы» 2024, ID 598";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function badge(g){
  if(!g) return "";
  const L=g[0];
  const cls = L==="A"?"gA":L==="B"?"gB":L==="C"?"gC":"gX";
  const title = L==="X"?"Не рекомендация КР — пояснение":`УУР ${L}, УДД ${g.slice(1)}`;
  return `<span class="gr ${cls}" title="${title}">${L==="X"?"инфо":"УУР "+L+" · УДД "+g.slice(1)}</span>`;
}
/* rec(текст, уровень, цитата, источник, off) */
function rec(t, g, q, src, off){
  return `<div class="rec${off?" off":""}"><div class="rt">${t}${badge(g)}</div>${q?`<details><summary>Цитата КР</summary><blockquote>${q}<cite>${src||""}</cite></blockquote></details>`:""}</div>`;
}
function sec(title, tone, items){
  items = items.filter(Boolean);
  if(!items.length) return "";
  return `<div class="sec ${tone}"><h4>${title}</h4>${items.join("")}</div>`;
}
function seg(key, opts, st){
  return `<div class="seg" data-k="${key}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" class="${String(st[key])===String(v)?"on":""}">${l}</button>`).join("")}</div>`;
}
function chk(key, label, st){
  return `<label><input type="checkbox" data-c="${key}" ${st[key]?"checked":""}> ${label}</label>`;
}
function bindForm(el, st, rerender){
  el.addEventListener("click", e=>{
    const b=e.target.closest(".seg button"); if(!b) return;
    const k=b.parentElement.dataset.k; st[k]=b.dataset.v; rerender();
  });
  el.addEventListener("change", e=>{
    const t=e.target;
    if(t.dataset.c){ st[t.dataset.c]=t.checked; rerender(); }
    if(t.dataset.n){ st[t.dataset.n]= t.type==="number"||t.type==="range" ? (t.value===""?"":+t.value) : t.value; rerender(); }
  });
  el.addEventListener("input", e=>{
    const t=e.target;
    if(t.type==="range" && t.dataset.n){ st[t.dataset.n]=+t.value; const o=document.getElementById(t.dataset.n+"-v"); if(o) o.textContent=t.value; renderOutOnly(); }
  });
}
let renderOutOnly = ()=>{};
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1500);}

/* ============ навигация ============ */
let curTab="mast";
document.getElementById("nav").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  curTab=b.dataset.t;
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.id==="t-"+curTab));
  updCopy(); window.scrollTo({top:0});
});
function updCopy(){ document.getElementById("copybar").classList.toggle("on",["mast","ddmzh","pain"].includes(curTab)); }
updCopy();

function outText(id){
  const el=document.getElementById(id).cloneNode(true);
  el.querySelectorAll("details,.gr").forEach(x=>x.remove());
  let out=[];
  el.querySelectorAll(".sec").forEach(s=>{
    out.push(s.querySelector("h4").textContent.toUpperCase());
    s.querySelectorAll(".rec").forEach(r=>{ if(!r.classList.contains("off")) out.push("— "+r.querySelector(".rt").textContent.trim()); });
    out.push("");
  });
  return out.join("\n").trim();
}
document.getElementById("copyBtn").onclick=()=>{
  const id={mast:"mast-out",ddmzh:"dd-out",pain:"pain-out"}[curTab];
  const txt=outText(id);
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Скопировано")).catch(()=>{
    const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();toast("Скопировано");
  });
};
document.getElementById("resetBtn").onclick=()=>{
  if(curTab==="mast"){Object.assign(MS,MS0());renderMast();}
  if(curTab==="ddmzh"){Object.assign(DS,DS0());renderDD();}
  if(curTab==="pain"){Object.assign(PS,PS0());renderPain();}
  toast("Сброшено");
};

/* =========================================================
   МАСТИТ (КР 858_1)
   ========================================================= */
const MS0=()=>({grp:"lact", form:"mast", time:"start", preterm:false, gbs:false, bilat:false, pcnAllergy:false, mrsa:false, crack:false, candida:false,
  nl_dis:"no", nl_cav:"none", nl_solid:false, nl_eff:"start", nl_type:"unk", nl_smoke:false, igm_sev:false, igm_cory:false,
  inf_cav:false, inf_sep:false, ch_comp:false});
const MS=MS0();

function renderMast(){
  const f=document.getElementById("mast-form");
  let h=`<div class="lbl">Группа</div>`+seg("grp",[["lact","Лактационный"],["nonlact","Нелактационный (взрослые)"],["inf","Младенец &lt;2 мес"],["child","Ребёнок &gt;2 мес / подросток"]],MS);
  if(MS.grp==="lact"){
    h+=`<div class="lbl">Форма (по Гуртовому)</div>`+seg("form",[["stasis","Лактостаз"],["mast","Серозный / инфильтративный"],["abs","Гнойный / абсцесс"],["phleg","Флегмона / сепсис"]],MS);
    h+=`<div class="lbl">Этап</div>`+seg("time",[["start","Первичный осмотр"],["c24","Консервативно ≥24 ч без эффекта"],["ab48","АБ ≥48 ч без эффекта"],["d7","≥7–10 сут без эффекта"]],MS);
    h+=`<div class="lbl">Особенности</div><div class="chk">`+
      chk("preterm","Ребёнок недоношенный",MS)+chk("gbs","СГВ (β-гемол. стрептококк B)",MS)+chk("bilat","Двусторонний",MS)+
      chk("pcnAllergy","Аллергия на пенициллины",MS)+chk("mrsa","Высокий риск MRSA",MS)+chk("crack","Инфицированная трещина",MS)+chk("candida","Кандидоз соска",MS)+`</div>`;
  } else if(MS.grp==="nonlact"){
    h+=`<div class="lbl">Вариант</div>`+seg("nl_type",[["unk","Неуточнённый / ПДМ"],["igm","ИГМ (гранулематозный)"],["tb","Подозрение на туберкулёзный"]],MS);
    h+=`<div class="lbl">Отделяемое из соска</div>`+seg("nl_dis",[["no","Нет"],["yes","Есть"]],MS);
    h+=`<div class="lbl">Полость по УЗИ (киста / абсцесс)</div>`+seg("nl_cav",[["none","Нет"],["lt1","&lt;1 см"],["ge1","≥1 см"]],MS);
    h+=`<div class="lbl">Ответ на лечение</div>`+seg("nl_eff",[["start","Старт"],["noeff","Нет эффекта АБ"],["d7","Нет эффекта 7–10 сут"],["recur","Рецидивирующий"]],MS);
    h+=`<div class="lbl">Дополнительно</div><div class="chk">`+chk("nl_solid","Плотное (солидное) образование",MS)+chk("nl_smoke","Курит",MS)+chk("pcnAllergy","Аллергия на пенициллины",MS)+chk("mrsa","Риск MRSA",MS);
    if(MS.nl_type==="igm") h+=chk("igm_sev","Множ. очаги &gt;5 см / двусторонний / изъязвление / свищи",MS)+chk("igm_cory","Corynebacterium в монокультуре",MS);
    h+=`</div>`;
  } else if(MS.grp==="inf"){
    h+=`<div class="lbl">Находки</div><div class="chk">`+chk("inf_cav","Полость &gt;1 см (абсцесс)",MS)+chk("inf_sep","Септические проявления",MS)+`</div>`;
  } else {
    h+=`<div class="lbl">Течение</div><div class="chk">`+chk("ch_comp","Осложнённое (лихорадка, системные симптомы, абсцесс, рецидив)",MS)+`</div>`;
  }
  f.innerHTML=h;
  mastOut();
}

function mastOut(){
  const o=document.getElementById("mast-out");
  const s=MS; let H="";
  if(s.grp==="lact") H=mastLact(s);
  else if(s.grp==="nonlact") H=mastNonLact(s);
  else if(s.grp==="inf") H=mastInf(s);
  else H=mastChild(s);
  o.innerHTML=H;
}

function abSchemes(s, lact){
  const r=[];
  if(s.pcnAllergy){
    r.push(rec(`<span class="dose">Клиндамицин** 300 мг каждые 8 ч внутрь</span> — при аллергии на бета-лактамы (взрослые и дети &gt;12 лет)`,"C5",
      "При аллергической реакции на бета-лактамные антибактериальные препараты (пенициллины) альтернативным препаратом для взрослых и детей старше 12 лет является клиндамицин** 300 мг каждые 8 часов внутрь.",SRC_M+", разд. 3.2"));
  } else {
    r.push(rec(`<span class="dose">Амоксициллин + клавулановая кислота 875+125 мг каждые 12 ч внутрь</span> (&gt;12 лет и &gt;40 кг) — эмпирически`,"C5",
      "Эмпирическая антибактериальная терапия мастита: Амоксициллин + [Клавулановая кислота] для пациентов в возрасте старше 12 лет и массой тела более 40 кг 875+125 мг каждые 12 часов внутрь…",SRC_M+", разд. 3.2"));
    if(lact) r.push(rec(`Альтернатива первой линии при лактационном: <span class="dose">цефалоспорины I–II поколения</span>`,"C5",
      "При лактационном мастите цефалоспорины первого и второго поколения также одобрены в качестве терапии первой линии.",SRC_M+", разд. 3.2"));
    else r.push(rec(`Альтернатива при нелактационном (подозрение на анаэробы): <span class="dose">амоксициллин** 500 мг каждые 6 ч + #метронидазол** 500 мг каждые 8 ч внутрь</span>`,"C5",
      "Альтернативная схема лечения при нелактационном мастите: для взрослых и детей массой тела свыше 40 кг амоксициллин** 500 мг каждые 6 часов внутрь + #метронидазол** 500 мг каждые 8 часов внутрь…",SRC_M+", разд. 3.2"));
  }
  if(s.mrsa) r.push(rec(`Высокий риск MRSA: <span class="dose">доксициклин** 100 мг каждые 12 ч внутрь</span>${lact?` <span class="warn">— КР не делает оговорки по лактации; сверить с инструкцией (тетрациклины при ГВ).</span>`:""}`,"C5",
      "При высоком риске инфекции, вызванной метициллинрезистентным золотистым стафилококком (MRSA), рекомендован прием доксициклина** 100 мг каждые 12 часов внутрь.",SRC_M+", разд. 3.2"));
  return r;
}

      "Рекомендовано женщинам с носительством патогенных вариантов… проводить селективный скрининг… включающий ежегодные ММГ и МРТ молочной железы, начиная с 30 лет, или на 5 лет раньше возраста наиболее молодой родственницы, заболевшей в семье РМЖ.",SRC_D+", разд. 5.3"));

      "Пациенткам с ДДМЖ старше 35 лет с атипической гиперплазией молочных желез рекомендуется прием риск-редуцирующих препаратов (антиэстрогены)…",SRC_D+", разд. 5.2"));

  // визуализация по поводу
  const v=[];
  if(s.preg) v.push(rec(`Беременность / лактация → <b>УЗИ МЖ</b>`,"B2","Рекомендуется ультразвуковое исследование молочных желез у взрослых пациенток до 40 лет, пациенток старше 40 лет с развитой железистой тканью, беременных и женщин в период лактации…",SRC_D+", разд. 2.4"));
  if(s.sit==="screen"){

}

const TR={order:[],i:0,ok:0,tot:0,stage:"cat",mode:"all",pickedCat:null,catOk:null};
function trInit(){
  const pool=CASES.map((c,i)=>i).filter(i=>TR.mode==="all"||CASES[i].m===TR.mode);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  TR.order=pool;TR.i=0;TR.ok=0;TR.tot=0;TR.stage="cat";trRender();
}
function trRender(){
  const el=document.getElementById("trainer");
  if(TR.i>=TR.order.length){
    el.innerHTML=`<div class="card"><h2>Итог</h2><p class="score" style="font-size:22px">${TR.ok} из ${TR.tot} верных ответов (категория + тактика)</p><button class="btn" id="tr-again">Ещё раз</button></div>`;
    document.getElementById("tr-again").onclick=trInit; return;
  }
  const c=CASES[TR.order[TR.i]];
  let h=`<div class="card"><div class="row" style="justify-content:space-between">
    ${seg("mode",[["all","Все"],["us","УЗИ"],["mg","ММГ"]],TR)}
    <span class="score">Кейс ${TR.i+1}/${TR.order.length} · ✓ ${TR.ok}</span></div></div>`;
  h+=`<div class="card"><div class="case-img">${c.img()}</div>
    <p style="margin:10px 0 0"><b>${c.age} лет.</b> ${c.txt}</p></div>`;
  h+=`<div class="card"><div class="lbl">1. Категория BI-RADS</div><div class="opts" id="tr-cat">${["0","1","2","3","4","5","6"].map(x=>`<button data-v="${x}">${x}</button>`).join("")}</div>`;
  if(TR.stage!=="cat"){
    h+=`<div class="lbl" style="margin-top:14px">2. Тактика по КР</div><div class="topts" id="tr-tac">${Object.entries(TAC).map(([k,v])=>`<button data-v="${k}">${v}</button>`).join("")}</div>`;
  }
  h+=`<div id="tr-fb"></div></div>`;
  el.innerHTML=h;
  el.querySelector(".seg").onclick=e=>{const b=e.target.closest("button");if(!b)return;TR.mode=b.dataset.v;trInit();};
  const catBox=document.getElementById("tr-cat");
  if(TR.stage==="cat"){
    catBox.onclick=e=>{const b=e.target.closest("button");if(!b)return;TR.pickedCat=b.dataset.v;TR.catOk=c.cat.includes(b.dataset.v);TR.stage="tac";trRender();};
  } else {
    catBox.querySelectorAll("button").forEach(b=>{b.disabled=true;if(c.cat.includes(b.dataset.v))b.classList.add("right");else if(b.dataset.v===TR.pickedCat)b.classList.add("wrong");});
  }
  if(TR.stage==="tac"){
    document.getElementById("tr-tac").onclick=e=>{const b=e.target.closest("button");if(!b)return;
      const tacOk=b.dataset.v===c.tac; TR.tot++; if(TR.catOk&&tacOk)TR.ok++;
      document.querySelectorAll("#tr-tac button").forEach(x=>{x.disabled=true;if(x.dataset.v===c.tac)x.classList.add("right");else if(x===b)x.classList.add("wrong");});
      document.getElementById("tr-fb").innerHTML=`<div class="sec ${TR.catOk&&tacOk?"ok":"red"}" style="margin-top:14px"><h4>${TR.catOk&&tacOk?"Верно":"Разбор"}: BI-RADS ${c.cat.join(" / ")} → ${TAC[c.tac]}</h4><div class="rec"><div class="rt">${c.ex}</div></div></div>
        <button class="btn" id="tr-next" style="width:100%">Следующий кейс →</button>`;
      TR.stage="done";
      document.getElementById("tr-next").onclick=()=>{TR.i++;TR.stage="cat";trRender();window.scrollTo({top:0});};
    };
  }
}
trInit();
